[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# ── Test database isolation ───────────────────────────────────────────────────
# Point the test suite at a SEPARATE database so pytest never writes to risk_db.
# These env vars are read by app/core/config.py (via pydantic-settings) before
# the SQLAlchemy engine is created in app/db/session.py.
# conftest.py sets these via os.environ BEFORE any app import — this entry here
# is a belt-and-suspenders fallback for any direct pytest invocations.
[env]
DATABASE_URL=postgresql+asyncpg://risk_user:risk_pass@postgres:5432/risk_db_test
DATABASE_URL_SYNC=postgresql://risk_user:risk_pass@postgres:5432/risk_db_test
